apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: eyego
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: dark2343/api:latest
          imagePullPolicy: Always
          env:
            - name: KAFKA_BROKER
              value: "kafka-0.kafka-service.eyego.svc.cluster.local:9092"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-uri-secret
                  key: MONGO_URI
          ports:
            - containerPort: 5000


---


apiVersion: v1
kind: Service
metadata:
  name: api-loadbalancer
  namespace: eyego
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http